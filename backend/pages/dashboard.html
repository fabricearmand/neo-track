<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NeoTrack</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-qrcode"></i>
            <span>NeoTrack</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#overview" class="nav-item active">
                <i class="fas fa-tachometer-alt"></i> Overview
            </a>
            <a href="#qr-codes" class="nav-item">
                <i class="fas fa-qrcode"></i> My QR Codes
            </a>
            <a href="#notifications" class="nav-item">
                <i class="fas fa-bell"></i> Notifications <span id="notifBadge" class="badge">0</span>
            </a>
            <a href="#settings" class="nav-item">
                <i class="fas fa-cog"></i> Settings
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                    <div id="userName" class="user-name">User Name</div>
                    <div id="userEmail" class="user-email">user@example.com</div>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>Dashboard</h1>
            <div class="header-actions">
                <button onclick="showQRManagement()" class="btn-primary">
                    <i class="fas fa-plus"></i> Add QR Code
                </button>
                <button onclick="showNotifications()" class="btn-secondary">
                    <i class="fas fa-bell"></i> Notifications
                </button>
            </div>
        </header>

        <!-- Overview Section -->
        <section id="overview" class="dashboard-section active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="statTotalQRCodes">0</h3>
                        <p>Total QR Codes</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="statNewNotifications">0</h3>
                        <p>New Notifications</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-eye"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="statTotalScans">0</h3>
                        <p>Total Scans</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="statItemsRecovered">0</h3>
                        <p>Items Recovered</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Recent Activity</h3>
                    <div id="activityList" class="activity-list">
                        <!-- Activity items will be loaded here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- QR Codes Section -->
        <section id="qr-codes" class="dashboard-section">
            <div class="section-header">
                <h2>My QR Codes</h2>
                <button onclick="window.location.href='/register'" class="btn-primary">
                    <i class="fas fa-plus"></i> Add New QR Code
                </button>
            </div>
            <div id="qrCodesGrid" class="qr-codes-grid">
                <!-- QR codes will be loaded here -->
            </div>
        </section>

        <!-- Notifications Section -->
        <section id="notifications" class="dashboard-section">
            <div class="section-header">
                <h2>Notifications</h2>
                <button onclick="markAllRead()" class="btn-secondary">
                    <i class="fas fa-check-double"></i> Mark All Read
                </button>
            </div>
            <div id="notificationsList" class="notifications-list">
                <!-- Notifications will be loaded here -->
            </div>
        </section>

        <!-- Settings Section -->
        <section id="settings" class="dashboard-section">
            <h2>Settings</h2>
            <div class="settings-content">
                <p>Settings panel will be implemented soon.</p>
            </div>
        </section>
    </div>

    <!-- QR Management Modal -->
    <div id="qrManagementModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('qrManagementModal')">&times;</span>
            <h2>Manage QR Code</h2>
            <form id="qrManagementForm">
                <div class="form-group">
                    <label for="qrText">Description</label>
                    <textarea id="qrText" name="qrText" rows="3" placeholder="Item description"></textarea>
                </div>
                <div class="form-group">
                    <label for="qrReward">Reward Amount (FCFA)</label>
                    <input type="number" id="qrReward" name="qrReward" placeholder="5000">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <button type="button" onclick="closeModal('qrManagementModal')" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/dashboard.js"></script>
</body>
</html>
