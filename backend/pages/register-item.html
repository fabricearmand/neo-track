<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Item - NeoTrack</title>
    <link rel="stylesheet" href="/assets/css/register-item.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="main-content" style="margin-left: 0; padding: 40px 20px;">
        <div class="container">
            <div class="register-item-card">
                <div class="register-header">
                    <i class="fas fa-shopping-cart"></i>
                    <h1>Register New Item</h1>
                    <p>Create a QR code for your valuable item</p>
                </div>

                <form id="registerItemForm" class="register-form">
                    <div class="form-section">
                        <h3><i class="fas fa-box"></i> Item Information</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="itemName">Item Name *</label>
                                <input type="text" id="itemName" name="itemName" placeholder="e.g., Laptop, Wallet, Keys" required>
                            </div>
                            <div class="form-group">
                                <label for="itemDescription">Description</label>
                                <textarea id="itemDescription" name="itemDescription" rows="3" placeholder="Describe your item in detail"></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="rewardAmount">Reward Amount (FCFA)</label>
                                <input type="number" id="rewardAmount" name="rewardAmount" placeholder="5000" min="0">
                            </div>
                            <div class="form-group">
                                <label for="qrType">QR Code Type</label>
                                <select id="qrType" name="qrType">
                                    <option value="basic">Basic (Free)</option>
                                    <option value="premium">Premium (1000 FCFA)</option>
                                    <option value="enterprise">Enterprise (5000 FCFA)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3><i class="fas fa-user"></i> Owner Information</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="ownerName">Your Name *</label>
                                <input type="text" id="ownerName" name="ownerName" placeholder="Your full name" required>
                            </div>
                            <div class="form-group">
                                <label for="ownerEmail">Email Address *</label>
                                <input type="email" id="ownerEmail" name="ownerEmail" placeholder="your@email.com" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ownerPhone">Phone Number</label>
                            <input type="tel" id="ownerPhone" name="ownerPhone" placeholder="+237 6XX XXX XXX">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3><i class="fas fa-phone"></i> Emergency Contact (Optional)</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="contactName">Contact Name</label>
                                <input type="text" id="contactName" name="contactName" placeholder="Alternative contact person">
                            </div>
                            <div class="form-group">
                                <label for="contactEmail">Contact Email</label>
                                <input type="email" id="contactEmail" name="contactEmail" placeholder="contact@email.com">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="contactPhone">Contact Phone</label>
                            <input type="tel" id="contactPhone" name="contactPhone" placeholder="+237 6XX XXX XXX">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-qrcode"></i> Generate QR Code
                        </button>
                        <a href="/dashboard" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerItemForm = document.getElementById('registerItemForm');

            if (registerItemForm) {
                registerItemForm.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    // Get user data from localStorage
                    const token = localStorage.getItem('token');
                    const userData = JSON.parse(localStorage.getItem('userData'));

                    if (!token || !userData) {
                        showMessage('Please login first', 'error');
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 1500);
                        return;
                    }

                    // Get form data
                    const formData = {
                        user_id: userData.id,
                        item_name: document.getElementById('itemName').value.trim(),
                        item_description: document.getElementById('itemDescription').value.trim(),
                        reward_amount: parseFloat(document.getElementById('rewardAmount').value) || 0,
                        qr_type: document.getElementById('qrType').value,
                        owner_name: document.getElementById('ownerName').value.trim(),
                        owner_email: document.getElementById('ownerEmail').value.trim(),
                        owner_phone: document.getElementById('ownerPhone').value.trim(),
                        contact_name: document.getElementById('contactName').value.trim(),
                        contact_email: document.getElementById('contactEmail').value.trim(),
                        contact_phone: document.getElementById('contactPhone').value.trim()
                    };

                    // Validate required fields
                    if (!formData.item_name || !formData.owner_name || !formData.owner_email) {
                        showMessage('Please fill in all required fields', 'error');
                        return;
                    }

                    try {
                        const submitBtn = registerItemForm.querySelector('button[type="submit"]');
                        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating QR Code...';
                        submitBtn.disabled = true;

                        const response = await fetch('http://localhost:3000/api/qr-codes', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify(formData)
                        });

                        const data = await response.json();

                        if (response.ok) {
                            // Store QR code data for success page
                            sessionStorage.setItem('qrCodeData', JSON.stringify({
                                qr_code_id: data.qr_code_id,
                                qr_code_data_url: data.qr_code_data_url,
                                item_name: formData.item_name,
                                owner_name: formData.owner_name
                            }));

                            showMessage('QR Code generated successfully!', 'success');
                            setTimeout(() => {
                                window.location.href = '/success';
                            }, 1500);
                        } else {
                            showMessage(data.error || 'Failed to generate QR code', 'error');
                        }
                    } catch (error) {
                        console.error('QR Code generation error:', error);
                        showMessage('Network error. Please try again.', 'error');
                    } finally {
                        const submitBtn = registerItemForm.querySelector('button[type="submit"]');
                        submitBtn.innerHTML = '<i class="fas fa-qrcode"></i> Generate QR Code';
                        submitBtn.disabled = false;
                    }
                });
            }
        });

        function showMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            messageDiv.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()">&times;</button>
            `;

            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 5px;
                color: white;
                font-weight: 600;
                z-index: 10000;
                display: flex;
                align-items: center;
                gap: 10px;
                max-width: 300px;
                animation: slideIn 0.3s ease;
            `;

            const colors = {
                success: '#28a745',
                error: '#dc3545',
                info: '#17a2b8',
                warning: '#ffc107'
            };
            messageDiv.style.backgroundColor = colors[type] || colors.info;

            document.body.appendChild(messageDiv);

            setTimeout(() => {
                if (messageDiv.parentElement) {
                    messageDiv.remove();
                }
            }, 5000);
        }
    </script>

    <style>
        .register-item-card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .register-header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .register-header i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .register-header h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        .register-header p {
            margin: 0;
            opacity: 0.9;
        }

        .register-form {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .form-section h3 {
            color: #ff6b35;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section h3 i {
            font-size: 1.2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ff6b35;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn-primary,
        .btn-secondary {
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: #ff6b35;
            color: white;
        }

        .btn-primary:hover {
            background: #e55a2b;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</body>
</html>
